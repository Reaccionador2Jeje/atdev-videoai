name: VideoAI CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check Python syntax
        run: python -m py_compile engine/server.py mcp_server.py mcp_http_server.py
      - name: Check browser JavaScript
        run: node --check editor.js && node --check app.js
      - name: Run renderer integration test
        run: python -m unittest discover -s tests -v
